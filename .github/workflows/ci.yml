name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run clean
      - run: npm run build
      - run: npm run build:declarations
      - run: npm run check:core-types
      - run: npm test
      - run: npm run pack:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wrist-menu-package
          path: artifacts/xleepy-wrist-menu-0.0.0.tgz

  consumers:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [three, react-18, react-19]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/consumers/${{ matrix.fixture }}/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wrist-menu-package
          path: artifacts
      - run: npm ci --ignore-scripts --prefix fixtures/consumers/${{ matrix.fixture }}
      - run: npm test --prefix fixtures/consumers/${{ matrix.fixture }}
